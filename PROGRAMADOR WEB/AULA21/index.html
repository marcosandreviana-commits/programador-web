<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Visualizador de Loops em JavaScript (For e While)</h1>
        <h5>Clique nos botôes abaixo para ver os laços de repetição gerando conteúdo dinamicamente na página.</h5>


    </header>

    <main>
        <section style="margin-bottom: 30px;">
            <h2>1.Exemplo com FOR(Contagem Regressiva)</h2>
            <button onClick= "executaFor()">Rodar loop FOR</button>

            <ul id="listaFor"></ul>


            <hr>
            <h2>2.Exemplo com WHILE(Colocando Roupas na Mala)</h2>
            <button onclick="executaWhile()">Rodar loop WHILE</button>
            <ul id="listaWhile"></ul>

        </section>
    </main>
    <footer>
        <h5>Obrigado pela preferência, Volte sempre!</h5>


    </footer>
    <script src="script.js"></script>

</body>

</html>
